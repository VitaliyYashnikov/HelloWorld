
trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  version: 1.0.$(Build.BuildId)
  
steps:
- task: UseDotNet@2
  inputs:
    version: '10.x'


- script: dotnet build HelloWorld.csproj -c Release -p:Version=$(version)
  displayName: 'Build'

- script: dotnet publish HelloWorld.csproj -c Release -p:Version=$(version) -o $(Build.ArtifactStagingDirectory)/app
  displayName: 'Publish'
  
- task: UniversalPackages@0
  displayName: 'Upload to Azure Artifacts'
  inputs:
    command: publish
    publishDirectory: '$(Build.ArtifactStagingDirectory)/app'
    vstsFeedPublish: 'vitaliyyashnikov/HelloWorldArtifacts'
    vstsFeedPackagePublish: 'helloworld'
    versionOption: custom
    versionPublish: '$(version)'