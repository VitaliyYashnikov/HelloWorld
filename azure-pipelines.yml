
trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  version: 1.0.$(Build.BuildId)
  
steps:
- task: UseDotNet@2
  inputs:
    version: '10.x'
- script: pwd

- script: dotnet build HelloWorld/HelloWorld.csproj -c Release -p:Version=$(version)
  displayName: 'Build'

- script: dotnet run --project HelloWorld/HelloWorld.csproj -c Release --no-build
  displayName: 'Run (print version)'