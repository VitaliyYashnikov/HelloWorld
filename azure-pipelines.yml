trigger:
  branches:
    include:
      - main
      - feature

pool:
  vmImage: ubuntu-latest

variables:
  version: 1.0.$(Build.BuildId)

stages:
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        version: '10.x'

    - script: dotnet build HelloWorld.csproj -c Release -p:Version=$(version)
      displayName: 'Build'

    - script: dotnet run --project HelloWorld.csproj -c Release --no-build
      displayName: 'Run (print version)'

    - script: dotnet publish HelloWorld.csproj -c Release -p:Version=$(version) -o $(Build.ArtifactStagingDirectory)/app
      displayName: 'Publish'

    - task: UniversalPackages@0
      displayName: 'Upload to Azure Artifacts'
      inputs:
        command: publish
        publishDirectory: '$(Build.ArtifactStagingDirectory)/app'
        vstsFeedPublish: 'vitaliyyashnikov/HelloWorldArtifacts'
        vstsFeedPackagePublish: 'helloworld'
        versionOption: custom
        versionPublish: '$(version)'

- stage: Conditioned
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/feature'))
  jobs:
  - job: Conditioned
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        version: '10.x'

    - task: SonarCloudPrepare@4.4.0
      displayName: 'SonarQube: Prepare'
      inputs:
        SonarQube: 'sonar-connection'
        organization: 'vitaliyyashnikov'
        scannerMode: 'dotnet'
        projectKey: 'VitaliyYashnikov_HelloWorld'
        projectName: 'HelloWorld'
        extraProperties: |
          sonar.qualitygate.wait=true

    - script: dotnet build HelloWorld.csproj -c Release -p:Version=$(version)
      displayName: 'Build'

    - script: dotnet test HelloWorld.Tests/HelloWorld.Tests.csproj -c Release --collect "XPlat Code Coverage" -- DataCollectionRunSettings.DataCollector.Configuration.Format=opencover
      displayName: 'Run tests with coverage'

    - task: SonarCloudAnalyze@4.4.0
      displayName: 'SonarQube: Analyze'

    - script: dotnet pack HelloWorld.csproj -c Release --no-build -p:PackageId="${BRANCH}_${VERSION}" -p:PackageVersion="$VERSION" -o $(Build.ArtifactStagingDirectory)/nuget
      displayName: 'Create NuGet package'
      env:
        BRANCH: $(Build.SourceBranchName)
        VERSION: $(version)

    - task: DotNetCoreCLI@2
      displayName: 'Push NuGet to Azure Artifacts'
      inputs:
        command: push
        packagesToPush: